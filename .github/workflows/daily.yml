name: 📰 GoldBrief Daily News + UI Integrity
on:
  schedule:
    # 8:30 ET: 12:30 UTC in daylight time; 13:30 UTC in standard time.
    # The Python gate prevents extra daily editions across DST.
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: goldbrief-daily
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Collect external RSS headlines when due
        env:
          GOLDBRIEF_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/daily_update.py
      - name: Run daily UI and site structure sweep
        run: |
          python3 tests/check_site.py > reports/daily-site-check.json
          cat reports/daily-site-check.json
      - name: Record UTC QA timestamp
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import datetime, json
          p = Path("reports/daily-site-check.json")
          report = json.loads(p.read_text())
          report["checked_at"] = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          report["review_scope"] = "Structural checks only; visual screenshots need human review"
          p.write_text(json.dumps(report,indent=2)+"\n")
          PY
      - name: Commit dated feed and integrity report to main
        run: |
          git config user.name "goldbrief-daily[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json reports/daily-site-check.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(daily): update sourced headlines and site integrity report"
            git push origin HEAD:main
          fi
