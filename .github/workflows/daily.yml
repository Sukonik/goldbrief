name: 📰 GoldBrief Daily News + UI Integrity
on:
  schedule:
    # Target: 8:30 AM America/New_York. 12:30 UTC = 8:30 EDT; 13:30 UTC = 8:30 EST.
    # scripts/daily_update.py only publishes in the 8-9 AM ET window and once per ET day.
    # GitHub may start scheduled runs late (often 5-30+ min); the real run time is
    # recorded in data/daily.json as actual_run_et.
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: goldbrief-daily
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect external RSS headlines when due
        env:
          GOLDBRIEF_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/daily_update.py
      - name: Structural checks
        run: python3 tests/check_site.py > /tmp/structural.json || true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Browser checks
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node tests/browser_check.js > /tmp/browser.json || true
      - name: Build daily review report
        run: python3 scripts/daily_report.py /tmp/structural.json /tmp/browser.json
      - name: Commit feed and report to main
        run: |
          git config user.name "goldbrief-daily[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json reports/daily-site-check.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(daily): update sourced headlines and site review report"
            git push origin HEAD:main
            # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy explicitly.
            gh workflow run pages.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Open an issue if checks failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '"result": "FAIL"' reports/daily-site-check.json; then
            gh issue create --title "Daily site review failed $(date -u +%F)" --label "daily-review" \
              --body "See reports/daily-site-check.json on main. Human design/editorial review required before any visual change. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || gh issue create --title "Daily site review failed $(date -u +%F)" --body "See reports/daily-site-check.json. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
