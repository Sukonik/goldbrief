name: 📰 GoldBrief Daily News + UI Integrity
on:
  schedule:
    # Target: edition live by 8:30 AM America/New_York. GitHub's scheduler is best-effort and
    # sometimes skips or delays runs, so there are four staggered attempts on off-peak minutes.
    # scripts/daily_update.py publishes only inside the 8-10 AM ET window and only once per ET day;
    # attempts after the first successful one exit in seconds. Covers EDT (12:xx/13:xx UTC = 8:xx/9:xx)
    # and EST (13:xx/14:xx UTC = 8:xx/9:xx).
    - cron: "7 12 * * *"
    - cron: "37 12 * * *"
    - cron: "7 13 * * *"
    - cron: "37 13 * * *"
    - cron: "7 14 * * *"
  workflow_dispatch:
    # External cron (docs/EXTERNAL_CRON.md) dispatches with no inputs: it publishes only when an
    # edition is due (8-10 AM ET window, once per ET day). Tick "force" to recollect immediately.
    inputs:
      force:
        description: "Force a new edition now, ignoring the time window and the once-per-day rule"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: goldbrief-daily
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect external RSS headlines when due
        id: collect
        env:
          GOLDBRIEF_MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          python3 scripts/daily_update.py
          if git diff --quiet data/daily.json && [ "$GOLDBRIEF_MANUAL" != "true" ]; then
            echo "due=false" >> "$GITHUB_OUTPUT"; echo "No new edition due; skipping QA and commit."
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Structural checks
        if: steps.collect.outputs.due == 'true'
        run: python3 tests/check_site.py > /tmp/structural.json || true
      - uses: actions/setup-node@v4
        if: steps.collect.outputs.due == 'true'
        with:
          node-version: 20
      - name: Browser checks
        if: steps.collect.outputs.due == 'true'
        # A browser-tooling outage must not block the headline edition; the report records it.
        continue-on-error: true
        timeout-minutes: 8
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install chromium
          node tests/browser_check.js > /tmp/browser.json || true
      - name: Build daily review report
        if: steps.collect.outputs.due == 'true'
        run: python3 scripts/daily_report.py /tmp/structural.json /tmp/browser.json
      - name: Commit feed and report to main
        if: steps.collect.outputs.due == 'true'
        run: |
          git config user.name "goldbrief-daily[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json reports/daily-site-check.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(daily): update sourced headlines and site review report"
            # main may have moved during the run (e.g. a merged PR); rebase and retry.
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i * 5))
            done
            git push --dry-run origin HEAD:main >/dev/null
            # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy explicitly.
            gh workflow run pages.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Open an issue if checks failed
        if: steps.collect.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '"result": "FAIL"' reports/daily-site-check.json; then
            gh issue create --title "Daily site review failed $(date -u +%F)" --label "daily-review" \
              --body "See reports/daily-site-check.json on main. Human design/editorial review required before any visual change. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || gh issue create --title "Daily site review failed $(date -u +%F)" --body "See reports/daily-site-check.json. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
