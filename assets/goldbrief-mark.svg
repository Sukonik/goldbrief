    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A6417"/>
      <stop offset="1" stop-color="#54360E"/>
    </linearGradient>
  </defs>
  <!-- The rear plane gives the bar structure real depth without a cartoon outline. -->
